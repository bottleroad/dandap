# Windows에서 단위 테스트와 npm 패키지 실제 설치(npx)·hook 실행을 검증하는 워크플로.
name: windows

on:
  push:
    branches: [main, ci/windows]
    paths:
      - 'installer/**'
      - 'hooks/**'
      - 'skills/**'
      - 'commands/**'
      - 'tests/**'
      - 'package.json'
      - '.github/**'
  pull_request:
    paths:
      - 'installer/**'
      - 'hooks/**'
      - 'skills/**'
      - 'commands/**'
      - 'tests/**'
      - 'package.json'
      - '.github/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 단위 테스트
        run: node --test
      - name: 패키지 생성
        shell: pwsh
        run: |
          $tgz = npm pack --silent
          "TGZ=$((Resolve-Path $tgz).Path)" >> $env:GITHUB_ENV
      - name: 설치 스모크 테스트 (공백·한글이 들어간 HOME)
        shell: pwsh
        run: node .github/scripts/install-smoke.js "$env:TGZ" "$env:RUNNER_TEMP\home 사용자"
